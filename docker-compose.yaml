services:
  mysql:
    image: mysql:8.4
    container_name: mysql_server

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: CSDL_VIEN_CHUC

    volumes:
      - mysql_volume:/var/lib/mysql
      - ./DB/DB_innit.sql:/docker-entrypoint-initdb.d/DB_innit.sql

    ports:
      - "${MYSQL_PORT}:3306"

    networks:
      - mysql_network
  php:
    build: .
    container_name: php_server
    volumes:
      - ./src:/var/www/html

    ports:
      - "${PHP_PORT}:80"

    networks:
      - mysql_network
volumes:
  mysql_volume:

networks:
  mysql_network: